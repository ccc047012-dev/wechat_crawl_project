name: run-analysis
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'
permissions:
  contents: write
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pandas openpyxl
      - name: Run analysis
        run: python analyze_data.py
      - name: Commit results back
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add processed_data output || true
          git commit -m "Auto analysis results [skip ci]" || echo "no changes"
          git push || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: analysis-output
          path: output/